name: Scalable Search Capacity Ladder

on:
  push:
    branches:
      - research/resource-monotone-overnight-20260913
  workflow_dispatch:
    inputs:
      case_id:
        description: Research case to run (push runs every matrix cell)
        required: true
        default: all
        type: choice
        options:
          - all
          - titan-to-rsv
          - titan-to-mystic-8
          - titan-to-s12-ultra
      capacity:
        description: Maximum filter capacity to run
        required: true
        default: all
        type: choice
        options:
          - all
          - '10'
          - '15'
          - '20'
      budget_seconds:
        description: Wall-clock budget for each independent cell
        required: true
        default: '60'
        type: string
      seed_file:
        description: Optional JSON filter seed for selected cells
        required: true
        default: ''
        type: choice
        options:
          - ''
          - packages/core/benchmarks/research/resourceMonotoneSeeds/titan-to-rsv-max10-60s.json

permissions:
  contents: read

concurrency:
  group: scalable-search-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ladder:
    strategy:
      fail-fast: false
      matrix:
        include:
          - case_id: titan-to-rsv
            max_filters: '10'
          - case_id: titan-to-rsv
            max_filters: '15'
          - case_id: titan-to-rsv
            max_filters: '20'
          - case_id: titan-to-mystic-8
            max_filters: '10'
          - case_id: titan-to-mystic-8
            max_filters: '15'
          - case_id: titan-to-mystic-8
            max_filters: '20'
          - case_id: titan-to-s12-ultra
            max_filters: '10'
          - case_id: titan-to-s12-ultra
            max_filters: '15'
          - case_id: titan-to-s12-ultra
            max_filters: '20'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Select matrix cell
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          REQUESTED_CASE: ${{ inputs.case_id || 'all' }}
          REQUESTED_CAPACITY: ${{ inputs.capacity || 'all' }}
          CELL_CASE: ${{ matrix.case_id }}
          CELL_CAPACITY: ${{ matrix.max_filters }}
        run: |
          run_cell=false
          if [[ "$EVENT_NAME" == "push" ]]; then
            run_cell=true
          elif [[
            ("$REQUESTED_CASE" == "all" || "$REQUESTED_CASE" == "$CELL_CASE") &&
            ("$REQUESTED_CAPACITY" == "all" || "$REQUESTED_CAPACITY" == "$CELL_CAPACITY")
          ]]; then
            run_cell=true
          fi
          echo "run=$run_cell" >> "$GITHUB_OUTPUT"
          echo "Selected=$run_cell case=$CELL_CASE capacity=$CELL_CAPACITY"

      - uses: actions/checkout@v4
        if: steps.select.outputs.run == 'true'
      - uses: pnpm/action-setup@v4
        if: steps.select.outputs.run == 'true'
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        if: steps.select.outputs.run == 'true'
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
        if: steps.select.outputs.run == 'true'
      - run: pnpm --filter @autoeq-workbench/core typecheck
        if: steps.select.outputs.run == 'true'
      - run: |
          pnpm --filter @autoeq-workbench/core exec vitest run \
            test/autoeq/v2/structuralSearch.test.ts \
            test/autoeq/v2/structuralScalableCapacityLadder.test.ts
        if: steps.select.outputs.run == 'true'
      - name: Run scalable capacity cell
        if: steps.select.outputs.run == 'true'
        env:
          CASE_ID: ${{ matrix.case_id }}
          MAX_FILTERS: ${{ matrix.max_filters }}
          BUDGET_SECONDS: ${{ inputs.budget_seconds || '60' }}
          SEED_FILE: ${{ inputs.seed_file || '' }}
          ARTIFACT_DIR: ${{ github.workspace }}/scalable-search-artifacts/${{ matrix.case_id }}/max-${{ matrix.max_filters }}
        run: |
          set -o pipefail
          mkdir -p "$ARTIFACT_DIR"
          command=(pnpm --filter @autoeq-workbench/core exec tsx benchmarks/structuralScalableCapacityLadder.ts \
            --case "$CASE_ID" \
            --capacity "$MAX_FILTERS" \
            --budget-seconds "$BUDGET_SECONDS" \
            --jsonl)
          if [[ -n "$SEED_FILE" ]]; then
            command+=(--seed-file "$SEED_FILE")
          fi
          "${command[@]}" | tee "$ARTIFACT_DIR/telemetry.jsonl"
      - name: Upload scalable search telemetry
        if: always() && steps.select.outputs.run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: scalable-search-${{ matrix.case_id }}-max-${{ matrix.max_filters }}-${{ github.run_id }}
          path: scalable-search-artifacts
          if-no-files-found: warn
          retention-days: 30
