name: Q31 x8 Shelf Sub-ablation Audit

on:
  push:
    branches:
      - research/audit-q31-x8-shelf-no-pk-to-shelf-20260912

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @autoeq-workbench/core typecheck
      - name: Run Q31 x8 shelf sub-ablation corpus audit
        env:
          GITHUB_SHA: ${{ github.sha }}
          AUDIT_OUTPUT_DIR: ${{ github.workspace }}/autoeq-shelf-sub-audit
        run: pnpm --filter @autoeq-workbench/core exec tsx benchmarks/q31x8ShelfAudit.ts
      - uses: actions/upload-artifact@v4
        with:
          name: q31-x8-shelf-sub-audit-${{ github.run_id }}
          path: autoeq-shelf-sub-audit
          if-no-files-found: error
          retention-days: 30
