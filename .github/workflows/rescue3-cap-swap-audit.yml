name: Rescue3 Cap Swap Audit

on:
  push:
    branches:
      - research/audit-q31-x8-depth2-rescue3-cap-swap-20260912

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @autoeq-workbench/core typecheck
      - name: Run Rescue3 cap-swap focused audit
        env:
          AUDIT_OUTPUT_DIR: ${{ github.workspace }}/rescue3-cap-swap-audit
        run: pnpm --filter @autoeq-workbench/core exec tsx benchmarks/rescue3CapSwapAudit.ts
      - uses: actions/upload-artifact@v4
        with:
          name: rescue3-cap-swap-audit-${{ github.run_id }}
          path: rescue3-cap-swap-audit
          if-no-files-found: error
          retention-days: 30
