name: Manual Real-FR Regression Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'packages/core/src/autoeq/v2/**'
      - 'packages/core/src/autoeq/types.ts'
      - 'packages/core/src/config/**'
      - 'packages/core/src/dsp/**'
      - 'packages/core/benchmarks/manualRegressionScalability.ts'
      - 'packages/core/benchmarks/research/manualRegression.ts'
      - 'packages/core/benchmarks/research/manual-regression-baseline.json'
      - 'packages/core/benchmarks/research/raw/manual/**'
      - 'packages/core/test/autoeq/v2/manualRegression.test.ts'
      - 'apps/web/src/session/workbenchSession.ts'
      - 'apps/web/src/session/workbenchSession.test.ts'
      - 'apps/web/src/workers/autoeq.worker.ts'
      - 'apps/web/src/workers/autoeq.worker.test.ts'
      - 'apps/web/src/state/autoeqController.ts'
      - 'apps/web/src/state/autoeqController.test.ts'
      - '.github/workflows/manual-regression-diagnostic.yml'

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @autoeq-workbench/core typecheck
      - run: pnpm --filter @autoeq-workbench/web typecheck
      - name: Verify manual regression fixtures
        run: pnpm --filter @autoeq-workbench/core exec vitest run test/autoeq/v2/manualRegression.test.ts --pool=threads --maxWorkers=1 --no-file-parallelism
      - name: Verify session provenance round-trip
        run: pnpm --filter @autoeq-workbench/web exec vitest run src/session/workbenchSession.test.ts --pool=threads --maxWorkers=1 --no-file-parallelism
      - name: Verify worker Max10 provenance
        run: pnpm --filter @autoeq-workbench/web exec vitest run src/workers/autoeq.worker.test.ts --pool=threads --maxWorkers=1 --no-file-parallelism
      - name: Verify controller provenance validation
        run: pnpm --filter @autoeq-workbench/web exec vitest run src/state/autoeqController.test.ts --pool=threads --maxWorkers=1 --no-file-parallelism
      - name: Run Max10 60s experimental manual regression diagnostic
        run: pnpm --filter @autoeq-workbench/core exec tsx benchmarks/manualRegressionScalability.ts
