name: Manual Real-FR Regression Diagnostic

on:
  push:
    branches:
      - research/manual-regression-curves-20260912

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @autoeq-workbench/core typecheck
      - name: Verify manual regression fixtures
        run: pnpm --filter @autoeq-workbench/core test -- manualRegression.test.ts
      - name: Run Max10 60s manual regression diagnostic
        run: pnpm --filter @autoeq-workbench/core exec tsx benchmarks/manualRegressionScalability.ts
