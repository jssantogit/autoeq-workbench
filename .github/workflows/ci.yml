name: CI

on:
  push:
    branches: [main, remake/squiglink-base]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm lint
      - run: pnpm --filter @autoeq-workbench/core benchmark
      - run: pnpm --dir apps/web exec playwright install --with-deps chromium
      - run: pnpm --filter ./apps/web e2e
