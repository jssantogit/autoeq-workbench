name: Dual-Order Real FR Gate

on:
  push:
    branches:
      - research/audit-q31-x8-rescue5-interior-dual-order-20260912

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @autoeq-workbench/core typecheck
      - name: Run blind real-FR gate
        run: pnpm --filter @autoeq-workbench/core exec tsx benchmarks/research/dualOrderRealCorpus.ts
