name: No PK Split Audit

on:
  push:
    branches:
      - research/audit-q31-x8-no-pk-split-20260912

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @autoeq-workbench/core typecheck
      - name: Run no-PK-split audit
        env:
          AUDIT_OUTPUT_DIR: ${{ github.workspace }}/no-pk-split-audit
        run: pnpm --filter @autoeq-workbench/core exec tsx benchmarks/noPkSplitAudit.ts
      - uses: actions/upload-artifact@v4
        with:
          name: no-pk-split-audit-${{ github.run_id }}
          path: no-pk-split-audit
          if-no-files-found: error
          retention-days: 30
