name: Scaled Polish Deep Audit

on:
  push:
    branches:
      - research/audit-scaled-polish-deep-20260912

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @autoeq-workbench/core typecheck
      - name: Run terminal scaled-polish audit
        env:
          GITHUB_SHA: ${{ github.sha }}
          AUDIT_OUTPUT_DIR: ${{ github.workspace }}/autoeq-structural-audit
        run: pnpm --filter @autoeq-workbench/core exec tsx benchmarks/research/structuralAudit.ts
      - uses: actions/upload-artifact@v4
        with:
          name: scaled-polish-deep-${{ github.run_id }}
          path: autoeq-structural-audit
          if-no-files-found: error
          retention-days: 30
