name: Drop Zero Gain Audit

on:
  push:
    branches:
      - research/audit-q31-x8-depth2-drop-zero-gain-20260912

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @autoeq-workbench/core typecheck
      - name: Run exact-zero canonicalization audit
        env:
          AUDIT_OUTPUT_DIR: ${{ github.workspace }}/drop-zero-gain-audit
        run: pnpm --filter @autoeq-workbench/core exec tsx benchmarks/dropZeroGainAudit.ts
      - uses: actions/upload-artifact@v4
        with:
          name: drop-zero-gain-audit-${{ github.run_id }}
          path: drop-zero-gain-audit
          if-no-files-found: error
          retention-days: 30
