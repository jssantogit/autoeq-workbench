name: Zero Plus Rescue Audit

on:
  push:
    branches:
      - research/audit-q31-x8-depth2-zero-plus-rescue-20260912

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @autoeq-workbench/core typecheck
      - name: Run zero-plus-rescue audit
        env:
          AUDIT_OUTPUT_DIR: ${{ github.workspace }}/zero-plus-rescue-audit
        run: pnpm --filter @autoeq-workbench/core exec tsx benchmarks/zeroPlusRescueAudit.ts
      - uses: actions/upload-artifact@v4
        with:
          name: zero-plus-rescue-audit-${{ github.run_id }}
          path: zero-plus-rescue-audit
          if-no-files-found: error
          retention-days: 30
