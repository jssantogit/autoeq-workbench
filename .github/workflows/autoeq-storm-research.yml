name: AutoEQ Storm Research CI

on:
  push:
    branches:
      - research/storm-diagnosis-20260910
  workflow_dispatch:
    inputs:
      campaign:
        description: Research campaign to replay when a frozen bundle is supplied
        required: true
        default: validation
        type: choice
        options: [validation, generalization]
      frozen_input_release_tag:
        description: Release tag containing autoeq-storm-frozen-inputs-v1.tar.gz
        required: false
        default: ''
        type: string
      expected_manifest_sha256:
        description: Optional pinned archive SHA-256 (defaults to the accepted v1 release on push)
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  static-verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Verify Storm research infrastructure
        run: |
          pnpm --filter @autoeq-workbench/core exec vitest run \
            test/autoeq/v2/research/frozenResearchInputs.test.ts \
            test/autoeq/v2/research/stormAdmissionHoldoutInventory.test.ts \
            test/autoeq/v2/research/stormAdmissionIndependentPolicyValidation.test.ts \
            test/autoeq/v2/research/stormAdmissionQuotaCampaign.test.ts \
            test/autoeq/v2/research/stormAdmissionQuotaAnytimeCampaign.test.ts \
            test/autoeq/v2/research/stormSearchExhaustionCensus.test.ts \
            test/autoeq/v2/research/stormBeamEscapeCausalCampaign.test.ts \
            test/autoeq/v2/research/stormBeamEscapeAnytimeCampaign.test.ts \
            test/autoeq/v2/research/stormAdmissionGeneralizationCampaign.test.ts \
            test/autoeq/v2/research/stormAdmissionValidationCampaign.test.ts
      - name: Verify core typecheck
        run: pnpm --filter @autoeq-workbench/core typecheck
      - name: Verify frozen-input CLI surface
        run: pnpm --filter @autoeq-workbench/core research:storm-frozen-inputs -- --help

  scientific-replay:
    runs-on: ubuntu-latest
    env:
      FROZEN_INPUT_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.frozen_input_release_tag || 'autoeq-storm-frozen-inputs-v1' }}
      EXPECTED_ARCHIVE_SHA256: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_manifest_sha256 || 'cc62a174220dcd4da4a17396d58d2807559ee557424b9c5f6961400037207667' }}
      CAMPAIGN: ${{ github.event_name == 'workflow_dispatch' && inputs.campaign || 'validation' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Download pinned frozen research inputs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -n "$FROZEN_INPUT_RELEASE_TAG"
          mkdir -p "$GITHUB_WORKSPACE/frozen-download" "$GITHUB_WORKSPACE/frozen-inputs"
          gh release download "$FROZEN_INPUT_RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern autoeq-storm-frozen-inputs-v1.tar.gz \
            --dir "$GITHUB_WORKSPACE/frozen-download"
          printf '%s  %s\n' "$EXPECTED_ARCHIVE_SHA256" "$GITHUB_WORKSPACE/frozen-download/autoeq-storm-frozen-inputs-v1.tar.gz" \
            | sha256sum --check -
          tar -xzf "$GITHUB_WORKSPACE/frozen-download/autoeq-storm-frozen-inputs-v1.tar.gz" \
            -C "$GITHUB_WORKSPACE/frozen-inputs"
      - name: Verify frozen research inputs
        run: |
          set -euo pipefail
          pnpm --filter @autoeq-workbench/core research:storm-frozen-inputs -- \
            verify --root "$GITHUB_WORKSPACE/frozen-inputs"
          echo "AUTOEQ_CAPACITY_RECOVERY_ROOT=$GITHUB_WORKSPACE/frozen-inputs/capacity-recovery" >> "$GITHUB_ENV"
      - name: Inventory independent Storm policy holdouts
        run: |
          set -euo pipefail
          pnpm --filter @autoeq-workbench/core research:storm-admission-holdout-inventory

      - name: Run independent admission policy validation
        run: |
          set -euo pipefail
          pnpm --filter @autoeq-workbench/core research:storm-admission-independent-policy-validation

      - name: Run lexical-RMSE admission quota campaign
        run: |
          set -euo pipefail
          pnpm --filter @autoeq-workbench/core research:storm-admission-quota-campaign

      - name: Run Q31-Q04 cost-aware anytime campaign
        run: |
          set -euo pipefail
          pnpm --filter @autoeq-workbench/core research:storm-admission-quota-anytime

      - name: Run structural search exhaustion census
        run: |
          set -euo pipefail
          pnpm --filter @autoeq-workbench/core research:storm-search-exhaustion-census

      - name: Run beam novelty-slot causal campaign
        run: |
          set -euo pipefail
          pnpm --filter @autoeq-workbench/core research:storm-beam-escape-causal

      - name: Run beam-escape Q31-Q04 anytime campaign
        run: |
          set -euo pipefail
          pnpm --filter @autoeq-workbench/core research:storm-beam-escape-anytime

      - name: Replay selected Storm campaign
        run: |
          set -euo pipefail
          case "$CAMPAIGN" in
            validation)
              pnpm --filter @autoeq-workbench/core research:storm-admission-validation
              ;;
            generalization)
              pnpm --filter @autoeq-workbench/core research:storm-admission-generalization
              ;;
            *)
              echo "Unsupported campaign: $CAMPAIGN" >&2
              exit 1
              ;;
          esac
      - name: Enforce research-only scope
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain -- packages/core/src apps vendor)"
          git diff --check
      - name: Collect replay evidence
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/storm-replay"
          cp "$GITHUB_WORKSPACE/frozen-inputs/manifest.json" "$GITHUB_WORKSPACE/storm-replay/frozen-input-manifest.json"
          cp packages/core/.research-artifacts/storm-admission-holdout-inventory-20260911/inventory-report.json "$GITHUB_WORKSPACE/storm-replay/holdout-inventory.json"
          cp packages/core/.research-artifacts/storm-admission-independent-policy-validation-20260911/campaign-report.json "$GITHUB_WORKSPACE/storm-replay/independent-policy-report.json"
          cp docs/superpowers/specs/2026-09-11-storm-admission-independent-policy-validation-results.md "$GITHUB_WORKSPACE/storm-replay/independent-policy-results.md"
          cp packages/core/.research-artifacts/storm-admission-quota-campaign-20260911/campaign-report.json "$GITHUB_WORKSPACE/storm-replay/quota-campaign-report.json"
          cp docs/superpowers/specs/2026-09-11-storm-admission-quota-campaign-results.md "$GITHUB_WORKSPACE/storm-replay/quota-campaign-results.md"
          cp packages/core/.research-artifacts/storm-admission-quota-anytime-20260911/campaign-report.json "$GITHUB_WORKSPACE/storm-replay/quota-anytime-report.json"
          cp docs/superpowers/specs/2026-09-11-storm-admission-quota-anytime-results.md "$GITHUB_WORKSPACE/storm-replay/quota-anytime-results.md"
          cp packages/core/.research-artifacts/storm-search-exhaustion-census-20260911/census-report.json "$GITHUB_WORKSPACE/storm-replay/search-exhaustion-census.json"
          cp docs/superpowers/specs/2026-09-11-storm-search-exhaustion-census-results.md "$GITHUB_WORKSPACE/storm-replay/search-exhaustion-census-results.md"
          cp packages/core/.research-artifacts/storm-beam-escape-causal-20260911/campaign-report.json "$GITHUB_WORKSPACE/storm-replay/beam-escape-causal-report.json"
          cp docs/superpowers/specs/2026-09-11-storm-beam-escape-causal-results.md "$GITHUB_WORKSPACE/storm-replay/beam-escape-causal-results.md"
          cp packages/core/.research-artifacts/storm-beam-escape-anytime-20260911/campaign-report.json "$GITHUB_WORKSPACE/storm-replay/beam-escape-anytime-report.json"
          cp docs/superpowers/specs/2026-09-11-storm-beam-escape-anytime-results.md "$GITHUB_WORKSPACE/storm-replay/beam-escape-anytime-results.md"
          if [[ "$CAMPAIGN" == "validation" ]]; then
            cp packages/core/.research-artifacts/storm-admission-validation-20260911/campaign-report.json "$GITHUB_WORKSPACE/storm-replay/campaign-report.json"
            cp docs/superpowers/specs/2026-09-11-storm-admission-validation-results.md "$GITHUB_WORKSPACE/storm-replay/results.md"
          else
            cp packages/core/.research-artifacts/storm-admission-generalization-20260911/campaign-report.json "$GITHUB_WORKSPACE/storm-replay/campaign-report.json"
            cp docs/superpowers/specs/2026-09-11-storm-admission-generalization-results.md "$GITHUB_WORKSPACE/storm-replay/results.md"
          fi
          printf '{"repositorySha":"%s","workflowRunId":"%s","campaign":"%s","frozenInputReleaseTag":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$CAMPAIGN" "$FROZEN_INPUT_RELEASE_TAG" \
            > "$GITHUB_WORKSPACE/storm-replay/replay-provenance.json"
      - name: Upload replay evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: autoeq-storm-replay-${{ github.run_id }}
          path: storm-replay
          if-no-files-found: error
          retention-days: 30
