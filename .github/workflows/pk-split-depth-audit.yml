name: PK Split Depth Audit

on:
  push:
    branches:
      - research/audit-q31-x8-pk-split-depth2-20260912

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @autoeq-workbench/core typecheck
      - name: Run PK split-depth audit
        env:
          AUDIT_OUTPUT_DIR: ${{ github.workspace }}/pk-split-depth-audit
        run: pnpm --filter @autoeq-workbench/core exec tsx benchmarks/pkSplitDepthAudit.ts
      - uses: actions/upload-artifact@v4
        with:
          name: pk-split-depth-audit-${{ github.run_id }}
          path: pk-split-depth-audit
          if-no-files-found: error
          retention-days: 30
