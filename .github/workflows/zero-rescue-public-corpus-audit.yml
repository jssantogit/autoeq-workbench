name: Zero Rescue Public Corpus Audit

on:
  push:
    branches:
      - research/audit-q31-x8-depth2-zero-plus-rescue-20260912

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @autoeq-workbench/core typecheck
      - name: Run zero-rescue public corpus audit
        env:
          GITHUB_SHA: ${{ github.sha }}
          AUDIT_OUTPUT_DIR: ${{ github.workspace }}/zero-rescue-corpus-audit
        run: pnpm --filter @autoeq-workbench/core exec tsx benchmarks/zeroRescueCorpusAudit.ts
      - uses: actions/upload-artifact@v4
        with:
          name: zero-rescue-corpus-audit-${{ github.run_id }}
          path: zero-rescue-corpus-audit
          if-no-files-found: error
          retention-days: 30
