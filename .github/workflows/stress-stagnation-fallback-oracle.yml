name: Stress Stagnation Fallback Oracle

on:
  push:
    branches:
      - research/audit-q31-x8-stagnation-fallback-stress-20260912

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @autoeq-workbench/core typecheck
      - name: Run stress stagnation fallback oracle
        env:
          AUDIT_OUTPUT_DIR: ${{ github.workspace }}/stress-stagnation-fallback-oracle
        run: pnpm --filter @autoeq-workbench/core exec tsx benchmarks/stressStagnationFallbackOracle.ts
      - uses: actions/upload-artifact@v4
        with:
          name: stress-stagnation-fallback-oracle-${{ github.run_id }}
          path: stress-stagnation-fallback-oracle
          if-no-files-found: error
          retention-days: 30
