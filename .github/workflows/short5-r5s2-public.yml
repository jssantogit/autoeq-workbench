name: Short5 R5S2 Public Corpus

on:
  push:
    branches:
      - research/audit-q31-x8-short5-r5s2-natural-20260912

permissions:
  contents: read

jobs:
  public:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @autoeq-workbench/core typecheck
      - run: pnpm --filter @autoeq-workbench/core exec tsx benchmarks/short5PublicCorpus.ts
