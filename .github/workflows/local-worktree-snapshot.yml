name: Local Worktree Snapshot

on:
  push:
    branches:
      - research/local-worktree-snapshot-postcap-swap2-20260912

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pack core source snapshot
        run: tar -czf local-worktree-snapshot.tgz package.json tsconfig.base.json packages/core
      - uses: actions/upload-artifact@v4
        with:
          name: local-worktree-snapshot-${{ github.run_id }}
          path: local-worktree-snapshot.tgz
          if-no-files-found: error
          retention-days: 1
