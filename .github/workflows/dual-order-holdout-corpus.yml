name: Dual-Order Holdout Corpus

on:
  push:
    branches:
      - research/audit-q31-x8-rescue5-interior-dual-order-20260912

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @autoeq-workbench/core typecheck
      - name: Run holdout corpus
        env:
          AUDIT_OUTPUT_DIR: ${{ github.workspace }}/dual-order-holdout-corpus
        run: pnpm --filter @autoeq-workbench/core exec tsx benchmarks/rescue5HoldoutCorpus.ts
      - uses: actions/upload-artifact@v4
        with:
          name: dual-order-holdout-corpus-${{ github.run_id }}
          path: dual-order-holdout-corpus
          if-no-files-found: error
          retention-days: 30
