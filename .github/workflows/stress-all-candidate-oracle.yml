name: Stress All Candidate Oracle

on:
  push:
    branches:
      - research/audit-q31-x8-depth2-stress-all-candidates-20260912

permissions:
  contents: read

jobs:
  oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @autoeq-workbench/core typecheck
      - name: Evaluate all rich PK candidates
        env:
          AUDIT_OUTPUT_DIR: ${{ github.workspace }}/stress-all-candidate-oracle
        run: pnpm --filter @autoeq-workbench/core exec tsx benchmarks/stressAllCandidateOracle.ts
      - uses: actions/upload-artifact@v4
        with:
          name: stress-all-candidate-oracle-${{ github.run_id }}
          path: stress-all-candidate-oracle
          if-no-files-found: error
          retention-days: 30
