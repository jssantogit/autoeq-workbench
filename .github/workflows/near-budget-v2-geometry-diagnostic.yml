name: Near Budget V2 Geometry Diagnostic

on:
  push:
    branches:
      - research/audit-q31-x8-replace-near-budget-20260912

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @autoeq-workbench/core typecheck
      - name: Diagnose V2 PK geometry
        env:
          AUDIT_OUTPUT_DIR: ${{ github.workspace }}/near-budget-v2-geometry-diagnostic
        run: pnpm --filter @autoeq-workbench/core exec tsx benchmarks/nearBudgetV2GeometryDiagnostic.ts
      - uses: actions/upload-artifact@v4
        with:
          name: near-budget-v2-geometry-diagnostic-${{ github.run_id }}
          path: near-budget-v2-geometry-diagnostic
          if-no-files-found: error
          retention-days: 30
