name: AutoEQ Solver Oracle Research

on:
  workflow_dispatch:
    inputs:
      corpus_layer:
        description: Approved corpus layer to run
        required: true
        default: adversarial
        type: choice
        options: [development, adversarial]
      campaign_mode:
        description: Staged Oracle compute mode; smoke is orchestration-only
        required: true
        default: screen
        type: choice
        options: [smoke, screen, confirm, deep, full]
      case_ids:
        description: Optional comma-separated approved case IDs for selective escalation
        required: false
        default: ''
        type: string
      max_filters:
        description: Maximum product filter capacity
        required: true
        default: '10'
        type: choice
        options: ['10', '20', '40']
      seeds:
        description: Comma-separated explicit optimizer seed pool
        required: true
        default: '11,29,47,83,101,131,167,197'
        type: string
      continuous_eval_budget:
        description: Optional stage budget override; zero selects the mode default
        required: true
        default: '0'
        type: string
      convergence_pilot_budgets:
        description: Comma-separated simple-case convergence pilot budgets for deep/full
        required: true
        default: '60,120,240,480'
        type: string
      mixed_generations:
        description: Deliverable Oracle mixed-search generations
        required: true
        default: '10'
        type: string

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      case_ids: ${{ steps.plan.outputs.case_ids }}
      case_ids_csv: ${{ steps.plan.outputs.case_ids_csv }}
      stage_config: ${{ steps.plan.outputs.stage_config }}
      stage_seeds: ${{ steps.plan.outputs.stage_seeds }}
      stage_budget: ${{ steps.plan.outputs.stage_budget }}
      artifact_prefix: ${{ steps.plan.outputs.artifact_prefix }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - name: Install research solver lab
        run: python -m pip install --upgrade pip && python -m pip install -e 'research/solver-lab[test]'
      - name: Export approved case plan
        env:
          CORPUS_LAYER: ${{ inputs.corpus_layer }}
          MAX_FILTERS: ${{ inputs.max_filters }}
          CASE_SELECTION: ${{ inputs.case_ids }}
          CAMPAIGN_MODE: ${{ inputs.campaign_mode }}
          SEED_POOL: ${{ inputs.seeds }}
          BUDGET_OVERRIDE: ${{ inputs.continuous_eval_budget }}
        run: |
          set -euo pipefail
          mkdir -p campaign-plan
          pnpm --silent --filter @autoeq-workbench/core research:lab -- export-problems \
            --layer "$CORPUS_LAYER" \
            --max-filters "$MAX_FILTERS" \
            --out campaign-plan/problems.jsonl
          stage_args=(--mode "$CAMPAIGN_MODE" --seed-pool "$SEED_POOL")
          if [[ "$BUDGET_OVERRIDE" != "0" ]]; then
            stage_args+=(--evaluation-budget "$BUDGET_OVERRIDE")
          fi
          PYTHONPATH=research/solver-lab/src python -m autoeq_solver_lab.campaign \
            stage-config "${stage_args[@]}" --out campaign-plan/stage-config.json
          python - "$CASE_SELECTION" campaign-plan/problems.jsonl campaign-plan/case-ids.json <<'PY'
          import json
          import sys
          from pathlib import Path

          selection = tuple(case_id for case_id in sys.argv[1].split(',') if case_id)
          available = sorted(
              json.loads(line)["problemId"]
              for line in Path(sys.argv[2]).read_text(encoding="utf-8").splitlines()
              if line.strip()
          )
          if selection:
              unknown = sorted(set(selection) - set(available))
              if unknown:
                  raise SystemExit(f"case IDs are not approved for the selected layer: {', '.join(unknown)}")
              if len(set(selection)) != len(selection):
                  raise SystemExit("case_ids contains duplicates")
              selected = sorted(selection)
          else:
              selected = available
          if not selected:
              raise SystemExit("selected corpus layer has no approved cases")
          Path(sys.argv[3]).write_text(json.dumps(selected, separators=(',', ':')) + "\n", encoding="utf-8")
          PY
      - name: Publish deterministic campaign plan
        id: plan
        env:
          MAX_FILTERS: ${{ inputs.max_filters }}
          CORPUS_LAYER: ${{ inputs.corpus_layer }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          case_ids="$(tr -d '\n' < campaign-plan/case-ids.json)"
          case_ids_csv="$(jq -r 'join(",")' campaign-plan/case-ids.json)"
          stage_config="$(tr -d '\n' < campaign-plan/stage-config.json)"
          stage_seeds="$(jq -r '.seeds | map(tostring) | join(",")' campaign-plan/stage-config.json)"
          stage_budget="$(jq -r '.evaluationBudgetPerRun' campaign-plan/stage-config.json)"
          artifact_prefix="autoeq-oracle-${RUN_ID}-${CORPUS_LAYER}-max${MAX_FILTERS}"
          {
            echo "case_ids=$case_ids"
            echo "case_ids_csv=$case_ids_csv"
            echo "stage_config=$stage_config"
            echo "stage_seeds=$stage_seeds"
            echo "stage_budget=$stage_budget"
            echo "artifact_prefix=$artifact_prefix"
          } >> "$GITHUB_OUTPUT"
          cat campaign-plan/stage-config.json
          cat campaign-plan/case-ids.json
      - name: Upload campaign plan
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.plan.outputs.artifact_prefix }}-plan
          path: campaign-plan
          if-no-files-found: error
          retention-days: 30

  verify:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - name: Verify research TypeScript tests
        run: pnpm --filter @autoeq-workbench/core test -- test/autoeq/v2/research
      - name: Verify core typecheck
        run: pnpm --filter @autoeq-workbench/core typecheck
      - name: Install research solver lab
        run: python -m pip install --upgrade pip && python -m pip install -e 'research/solver-lab[test]'
      - name: Verify Python solver lab tests
        run: python -m pytest -q research/solver-lab/tests
      - name: Run convergence pilots for deep/full campaigns
        if: ${{ inputs.campaign_mode == 'deep' || inputs.campaign_mode == 'full' }}
        env:
          SEEDS: ${{ inputs.seeds }}
          PILOT_BUDGETS: ${{ inputs.convergence_pilot_budgets }}
          CORPUS_LAYER: ${{ inputs.corpus_layer }}
          MAX_FILTERS: ${{ inputs.max_filters }}
        run: |
          set -euo pipefail
          mkdir -p pilot
          pnpm --silent --filter @autoeq-workbench/core research:lab -- export-problems \
            --layer "$CORPUS_LAYER" --max-filters "$MAX_FILTERS" --out pilot/problems.jsonl
          PYTHONPATH=research/solver-lab/src python -m autoeq_solver_lab.convergence_pilot \
            --problems pilot/problems.jsonl \
            --out pilot/convergence-pilot.json \
            --case-ids synthetic-narrow-peak,synthetic-strong-shelf \
            --seeds "$SEEDS" \
            --budgets "$PILOT_BUDGETS" \
            --filter-count 1 \
            --canonical-command 'pnpm --filter @autoeq-workbench/core research:lab --'
      - name: Upload convergence pilot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact_prefix }}-pilot
          path: pilot
          if-no-files-found: ignore
          retention-days: 30

  oracle-case:
    needs: prepare
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        case_id: ${{ fromJSON(needs.prepare.outputs.case_ids) }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pnpm install --frozen-lockfile
      - name: Install research solver lab
        run: python -m pip install --upgrade pip && python -m pip install -e 'research/solver-lab[test]'
      - name: Name case artifact
        id: naming
        env:
          CASE_ID: ${{ matrix.case_id }}
          ARTIFACT_PREFIX: ${{ needs.prepare.outputs.artifact_prefix }}
        run: |
          set -euo pipefail
          safe_case_id="$(tr -c 'A-Za-z0-9_.-' '-' <<< "$CASE_ID" | sed 's/-$//')"
          echo "name=${ARTIFACT_PREFIX}-${safe_case_id}" >> "$GITHUB_OUTPUT"
      - name: Prepare case artifact directory
        env:
          STAGE_CONFIG: ${{ needs.prepare.outputs.stage_config }}
        run: |
          set -euo pipefail
          mkdir -p oracle-artifacts
          printf '%s\n' "$STAGE_CONFIG" > oracle-artifacts/stage-config.json
      - name: Export one approved solver lab case
        env:
          CORPUS_LAYER: ${{ inputs.corpus_layer }}
          MAX_FILTERS: ${{ inputs.max_filters }}
          CASE_ID: ${{ matrix.case_id }}
        run: pnpm --silent --filter @autoeq-workbench/core research:lab -- export-problems --layer "$CORPUS_LAYER" --case-id "$CASE_ID" --max-filters "$MAX_FILTERS" --out oracle-artifacts/problems.jsonl
      - name: Run one Standard v2 control case
        env:
          CORPUS_LAYER: ${{ inputs.corpus_layer }}
          MAX_FILTERS: ${{ inputs.max_filters }}
          CASE_ID: ${{ matrix.case_id }}
          REPOSITORY_SHA: ${{ github.sha }}
        run: pnpm --silent --filter @autoeq-workbench/core research:oracle-report -- --layer "$CORPUS_LAYER" --case-id "$CASE_ID" --max-filters "$MAX_FILTERS" --budget-seconds 30 --repository-sha "$REPOSITORY_SHA" --out oracle-artifacts/control.json
      - name: Run one Continuous Oracle case
        env:
          SEEDS: ${{ needs.prepare.outputs.stage_seeds }}
          MAX_FILTERS: ${{ inputs.max_filters }}
          EVAL_BUDGET: ${{ needs.prepare.outputs.stage_budget }}
          CAMPAIGN_MODE: ${{ inputs.campaign_mode }}
          CASE_ID: ${{ matrix.case_id }}
        run: |
          set -euo pipefail
          filter_counts="$(seq -s, 1 "$MAX_FILTERS")"
          polish_strategy=shortlist
          if [[ "$CAMPAIGN_MODE" == "full" ]]; then polish_strategy=all; fi
          PYTHONPATH=research/solver-lab/src python -m autoeq_solver_lab.continuous_oracle \
            --problems oracle-artifacts/problems.jsonl \
            --out oracle-artifacts/continuous.json \
            --seeds "$SEEDS" \
            --filter-counts "$filter_counts" \
            --max-filters "$MAX_FILTERS" \
            --control oracle-artifacts/control.json \
            --eval-budget "$EVAL_BUDGET" \
            --case-id "$CASE_ID" \
            --campaign-mode "$CAMPAIGN_MODE" \
            --polish-strategy "$polish_strategy" \
            --canonical-command 'pnpm --filter @autoeq-workbench/core research:lab --'
      - name: Run one Deliverable Oracle case
        env:
          CASE_ID: ${{ matrix.case_id }}
          CAMPAIGN_MODE: ${{ inputs.campaign_mode }}
          MAX_FILTERS: ${{ inputs.max_filters }}
          EVAL_BUDGET: ${{ needs.prepare.outputs.stage_budget }}
          MIXED_GENERATIONS: ${{ inputs.mixed_generations }}
        run: |
          set -euo pipefail
          PYTHONPATH=research/solver-lab/src python -m autoeq_solver_lab.deliverable_oracle \
            --problems oracle-artifacts/problems.jsonl \
            --continuous-frontier oracle-artifacts/continuous.json \
            --out oracle-artifacts/deliverable.json \
            --seed 41 \
            --generations "$MIXED_GENERATIONS" \
            --eval-budget "$EVAL_BUDGET" \
            --canonical-command 'pnpm --filter @autoeq-workbench/core research:lab --' \
            --max-filters "$MAX_FILTERS" \
            --case-id "$CASE_ID" \
            --campaign-mode "$CAMPAIGN_MODE" \
            --control oracle-artifacts/control.json
      - name: Write self-contained case manifest
        if: always()
        env:
          REPOSITORY_SHA: ${{ github.sha }}
          CASE_ID: ${{ matrix.case_id }}
          CORPUS_LAYER: ${{ inputs.corpus_layer }}
          MAX_FILTERS: ${{ inputs.max_filters }}
          ARTIFACT_NAME: ${{ steps.naming.outputs.name }}
          STAGE_CONFIG: ${{ needs.prepare.outputs.stage_config }}
        run: |
          set -euo pipefail
          if [[ -f oracle-artifacts/problems.jsonl && -f oracle-artifacts/continuous.json && -f oracle-artifacts/deliverable.json ]]; then
            printf '%s\n' "$STAGE_CONFIG" > oracle-artifacts/stage-config.json
            PYTHONPATH=research/solver-lab/src python -m autoeq_solver_lab.campaign \
              case-manifest \
              --artifact-dir oracle-artifacts \
              --repository-sha "$REPOSITORY_SHA" \
              --case-id "$CASE_ID" \
              --corpus-layer "$CORPUS_LAYER" \
              --max-filters "$MAX_FILTERS" \
              --stage-config oracle-artifacts/stage-config.json \
              --node-version "$(node --version)" \
              --python-version "$(python --version 2>&1 | awk '{print $2}')" \
              --workflow-run-id "${GITHUB_RUN_ID}" \
              --artifact-name "$ARTIFACT_NAME"
          else
            echo "case computation did not produce a complete artifact" >&2
          fi
      - name: Upload self-contained case artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.naming.outputs.name }}
          path: oracle-artifacts
          if-no-files-found: warn
          retention-days: 30

  aggregate:
    needs: [prepare, verify, oracle-case]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research solver lab
        run: python -m pip install --upgrade pip && python -m pip install -e 'research/solver-lab[test]'
      - name: Download case artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: ${{ needs.prepare.outputs.artifact_prefix }}-*
          path: case-artifacts
          merge-multiple: false
      - name: Download convergence pilot
        uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: ${{ needs.prepare.outputs.artifact_prefix }}-pilot
          path: pilot
      - name: Aggregate and validate every case
        id: aggregate
        env:
          CASE_IDS: ${{ needs.prepare.outputs.case_ids_csv }}
          REPOSITORY_SHA: ${{ github.sha }}
          CORPUS_LAYER: ${{ inputs.corpus_layer }}
          MAX_FILTERS: ${{ inputs.max_filters }}
          STAGE_CONFIG: ${{ needs.prepare.outputs.stage_config }}
          AGGREGATE_ARTIFACT_NAME: ${{ needs.prepare.outputs.artifact_prefix }}-aggregate
          PILOT_ARTIFACT_NAME: ${{ needs.prepare.outputs.artifact_prefix }}-pilot
        run: |
          set +e
          mkdir -p oracle-aggregate
          printf '%s\n' "$STAGE_CONFIG" > oracle-aggregate/stage-config.json
          PYTHONPATH=research/solver-lab/src python -m autoeq_solver_lab.campaign \
            aggregate \
            --case-artifacts-dir case-artifacts \
            --expected-case-ids "$CASE_IDS" \
            --repository-sha "$REPOSITORY_SHA" \
            --corpus-layer "$CORPUS_LAYER" \
            --max-filters "$MAX_FILTERS" \
            --stage-config oracle-aggregate/stage-config.json \
            --out-dir oracle-aggregate \
            --aggregate-artifact-name "$AGGREGATE_ARTIFACT_NAME" \
            --pilot-artifact-name "$PILOT_ARTIFACT_NAME"
          if [[ -f pilot/convergence-pilot.json ]]; then
            PYTHONPATH=research/solver-lab/src python -m autoeq_solver_lab.campaign \
              aggregate \
              --case-artifacts-dir case-artifacts \
              --expected-case-ids "$CASE_IDS" \
              --repository-sha "$REPOSITORY_SHA" \
              --corpus-layer "$CORPUS_LAYER" \
              --max-filters "$MAX_FILTERS" \
              --stage-config oracle-aggregate/stage-config.json \
              --out-dir oracle-aggregate \
              --aggregate-artifact-name "$AGGREGATE_ARTIFACT_NAME" \
              --pilot-artifact-name "$PILOT_ARTIFACT_NAME" \
              --pilot pilot/convergence-pilot.json
          fi
          status=$?
          if [[ "$status" -ne 0 && ! -f oracle-aggregate/campaign-manifest.json ]]; then
            python - "$status" "$CASE_IDS" "$REPOSITORY_SHA" "$CORPUS_LAYER" "$MAX_FILTERS" > oracle-aggregate/campaign-manifest.json <<'PY'
          import json
          import sys
          print(json.dumps({
              "schemaVersion": 1,
              "repositorySha": sys.argv[3],
              "corpusLayer": sys.argv[4],
              "maxFilters": int(sys.argv[5]),
              "complete": False,
              "expectedCaseIds": [case_id for case_id in sys.argv[2].split(',') if case_id],
              "completedCaseIds": [],
              "missingCaseIds": [case_id for case_id in sys.argv[2].split(',') if case_id],
              "errors": [f"aggregation command exited with status {sys.argv[1]}"],
          }, indent=2, sort_keys=True))
          PY
          fi
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload deterministic aggregate artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.prepare.outputs.artifact_prefix }}-aggregate
          path: |
            oracle-aggregate
            pilot
          if-no-files-found: warn
          retention-days: 30
      - name: Refuse incomplete campaign
        if: always()
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest_path = Path("oracle-aggregate/campaign-manifest.json")
          if not manifest_path.is_file():
              raise SystemExit("campaign manifest was not produced")
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))
          if manifest.get("complete") is not True:
              raise SystemExit("Oracle campaign incomplete; calibration cannot freeze")
          PY
